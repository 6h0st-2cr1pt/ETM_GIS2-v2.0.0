{% extends 'app/auth_base.html' %}
{% load static %}

{% block content %}
<div class="login-split-container">
    <!-- Left side: Forest Image -->
    <div class="login-image-section">
        <img src="{% static 'images/forest.jpg' %}" alt="Forest" class="login-forest-image">
    </div>

    <!-- Right side: Login Form -->
    <div class="login-form-section">
        <div class="login-form-wrapper">
            <h1 class="login-hello">HELLO!</h1>
            <p class="login-subtitle">Welcome to Endemic Trees Monitoring System</p>

            {% if error_message %}
            <div class="alert alert-danger login-alert">
                {{ error_message }}
            </div>
            {% endif %}

            <form method="post" action="{% url 'app:login' %}" class="login-form">
                {% csrf_token %}

                <div class="form-group">
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-user"></i></span>
                        <input type="text" id="username" name="username" class="form-control" placeholder="email or username" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control" placeholder="password" required>
                    </div>
                </div>

                <button type="submit" class="login-next-btn">
                    <span>Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="admin-contact-note">
                <p><i class="fas fa-info-circle"></i> Need an account or password reset? Please contact the system administrator.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
