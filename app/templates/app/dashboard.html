{% extends 'app/base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/dashboard.css">
{% endblock %}

{% block content %}
<div class="dashboard-container">
 <!--   <h1 class="page-title">Dashboard</h1> -->

    <!-- KPI Summary Cards -->
    <div class="kpi-cards-container">
        <div class="kpi-card">
            <div class="kpi-icon" style="background: linear-gradient(135deg, rgba(0, 184, 148, 0.9), rgba(0, 206, 201, 0.7));">
                <i class="fas fa-tree"></i>
            </div>
            <div class="kpi-content">
                <h3 id="kpi-total-trees">0</h3>
                <p>Total Trees</p>
            </div>
        </div>

        <div class="kpi-card">
            <div class="kpi-icon" style="background: linear-gradient(135deg, rgba(155, 89, 182, 0.9), rgba(142, 68, 173, 0.7));">
                <i class="fas fa-seedling"></i>
            </div>
            <div class="kpi-content">
                <h3 id="kpi-planted-existing">0 / 0</h3>
                <p>Planted / Existing</p>
            </div>
        </div>

        <div class="kpi-card">
            <div class="kpi-icon" style="background: linear-gradient(135deg, rgba(46, 204, 113, 0.9), rgba(39, 174, 96, 0.7));">
                <i class="fas fa-heart"></i>
            </div>
            <div class="kpi-content">
                <h3 id="kpi-total-healthy">0%</h3>
                <p>Percentage of Healthy Trees</p>
            </div>
        </div>

        <div class="kpi-card">
            <div class="kpi-icon" style="background: linear-gradient(135deg, rgba(231, 76, 60, 0.9), rgba(192, 57, 43, 0.7));">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div class="kpi-content">
                <h3 id="kpi-total-unhealthy">0%</h3>
                <p>Percentage of Unhealthy Trees</p>
            </div>
        </div>
    </div>

    <!-- Charts Section -->
    <div class="dashboard-charts-grid">
        <div class="chart-card full-width">
            <h3>Species Distribution (Treemap)</h3>
            <canvas id="speciesTreemapChart"></canvas>
            <div class="no-data-message" style="display: none;">No data available</div>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
