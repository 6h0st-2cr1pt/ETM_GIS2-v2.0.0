{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endemic Trees Monitoring - Authentication</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS - Load auth.css AFTER Bootstrap to override -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=2.2">
    
    <!-- Inline critical CSS as fallback -->
    <style>
        .login-split-container {
            display: flex !important;
            min-height: 100vh !important;
            width: 100% !important;
        }
        .login-form-section {
            flex: 1 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background-color: #1a1a1a !important;
            padding: 2rem !important;
        }
        .login-image-section {
            flex: 1 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background-color: #f3f4f6 !important;
            overflow: hidden !important;
            position: relative !important;
        }
        .login-forest-image {
            width: 100% !important;
            height: 100vh !important;
            object-fit: cover !important;
            display: block !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
        .login-hello {
            font-size: 3.5rem !important;
            font-weight: 700 !important;
            color: #7FB482 !important;
            margin-bottom: 0.5rem !important;
        }
        .login-hello::after {
            content: '' !important;
            display: block !important;
            width: 80px !important;
            height: 4px !important;
            background: #7FB482 !important;
            margin-top: 0.5rem !important;
        }
        .login-form .form-control {
            background-color: #D6E993 !important;
            color: #1a1a1a !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
        }
        .login-form .form-control::placeholder {
            color: rgba(26, 26, 26, 0.6) !important;
        }
        .login-form .form-control:focus {
            background-color: #D6E993 !important;
            border-color: #7FB482 !important;
            box-shadow: 0 0 0 3px rgba(127, 180, 130, 0.3) !important;
        }
        .login-form .input-icon {
            color: rgba(26, 26, 26, 0.6) !important;
        }
        .login-next-btn {
            background: linear-gradient(135deg, #0A2E30 0%, #0D1F25 50%, #519269 100%) !important;
        }
        .login-next-btn:hover {
            background: linear-gradient(135deg, #0D1F25 0%, #0A2E30 50%, #519269 100%) !important;
        }
    </style>
</head>
<body class="auth-body">
    {% if messages %}
    <div class="notification-container">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show notification" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
